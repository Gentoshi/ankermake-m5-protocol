services:
    ankerctl:
        image: ankerctl:latest
        container_name: ankerctl
        restart: unless-stopped
        build: .

        # Host networking is required for PPPP LAN traffic (direct UDP to printer).
        # Port mapping alone is insufficient because PPPP sends UDP directly to
        # the printer's IP, which requires the container to be on the same subnet.
        # NOTE: network_mode: host is supported on Linux. On macOS/Windows Docker
        # Desktop, use a custom bridge network that reaches your LAN instead.
        network_mode: host

        environment:
            - FLASK_HOST=0.0.0.0
            - FLASK_PORT=${FLASK_PORT:-4470}
        volumes:
            - ${ANKERCTL_DATA:-ankerctl_vol}:/root/.config/ankerctl

volumes:
    ankerctl_vol:
